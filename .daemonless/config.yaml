icon: ':simple-onlyoffice:'

cit:
  mode: port
  port: 80
  wait: 180
  screenshot: /example/

build:
  variants:
    # pkg-latest disabled: www/onlyoffice-documentserver fails to build on the
    # ports main branch (npm ENOTCACHED), so it is absent from the latest repo.
    # Kept as an alias of pkg so the published tag does not disappear.
    - tag: pkg
      containerfile: Containerfile.pkg
      default: true
      aliases: ["latest", "pkg-latest"]
